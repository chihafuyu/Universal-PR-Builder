version: 2

updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Jakarta"

    open-pull-requests-limit: 10

    groups:
      github-actions:
        patterns:
          - "*"

    commit-message:
      prefix: "ci"
      include: "scope"

    labels:
      - "dependencies"
      - "github-actions"

  # npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Jakarta"

    open-pull-requests-limit: 10

    groups:
      npm-dependencies:
        patterns:
          - "*"

    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"

    labels:
      - "dependencies"
      - "npm"

  # Gradle
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Jakarta"

    open-pull-requests-limit: 10

    groups:
      gradle-dependencies:
        patterns:
          - "*"

    commit-message:
      prefix: "deps"
      include: "scope"

    labels:
      - "dependencies"
      - "gradle"

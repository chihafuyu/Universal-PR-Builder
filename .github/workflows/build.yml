name: Build PRs (Multi-Repo)

on:
  workflow_dispatch:
    inputs:
      pr_list:
        description: 'Gradle targets (owner/repo#PR, comma-separated). Leave empty to skip.'
        required: false
        default: ''
        type: string
      fennec_version:
        description: 'Fennec version: versionCode (e.g. 1590000) or versionName (e.g. 159.0.0). Leave empty to skip.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      gradle_targets: ${{ steps.parse.outputs.gradle_targets }}
      fennec_version: ${{ steps.parse.outputs.fennec_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Parse and validate inputs
        id: parse
        env:
          PR_LIST: ${{ inputs.pr_list }}
          FENNEC_VERSION: ${{ inputs.fennec_version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 main.py >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    if: needs.setup.outputs.gradle_targets != '[]'
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: ${{ fromJson(needs.setup.outputs.gradle_targets) }}
    runs-on: ubuntu-latest
    steps:
      - name: Compute safe identifiers
        id: ids
        env:
          REPO: ${{ matrix.target.repo }}
          PR: ${{ matrix.target.pr }}
        shell: bash
        run: |
          set -Eeuo pipefail
          SAFE_REPO="${REPO//\//__}"
          printf 'safe_repo=%s\n' "$SAFE_REPO" >> "$GITHUB_OUTPUT"

      - name: Checkout PR ${{ matrix.target.pr }}
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.target.repo }}
          ref: refs/pull/${{ matrix.target.pr }}/head
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            npm ci --ignore-scripts --no-audit --no-fund
          elif [[ -f package.json ]]; then
            npm install --ignore-scripts --no-audit --no-fund
          else
            echo 'No package.json found; skipping npm dependency installation.'
          fi

      - name: Get Commit Hash & Create Changelog
        id: git-info
        env:
          REPO: ${{ matrix.target.repo }}
          PR: ${{ matrix.target.pr }}
          SAFE_REPO: ${{ steps.ids.outputs.safe_repo }}
        shell: bash
        run: |
          set -Eeuo pipefail
          COMMIT_HASH="$(git log -1 --format='%h')"
          printf 'hash=%s\n' "$COMMIT_HASH" >> "$GITHUB_OUTPUT"

          REPO_URL="https://github.com/${REPO}"
          COMMIT_URL="${REPO_URL}/commit/${COMMIT_HASH}"
          PR_URL="${REPO_URL}/pull/${PR}"
          CHANGELOG="changelog-${SAFE_REPO}-${PR}.txt"

          printf '%s\n' "- PR [#${PR}](${PR_URL}) (Commit: [\`${COMMIT_HASH}\`](${COMMIT_URL}), Repo: [${REPO}](${REPO_URL}))" > "$CHANGELOG"

      - name: Build with Gradle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ./gradlew clean :patches:buildAndroid --no-daemon

      - name: Prepare Assets
        env:
          SAFE_REPO: ${{ steps.ids.outputs.safe_repo }}
          PR: ${{ matrix.target.pr }}
          HASH: ${{ steps.git-info.outputs.hash }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p output

          shopt -s nullglob
          artifacts=(patches/build/libs/patches-*.mpp)

          if (( ${#artifacts[@]} != 1 )); then
            echo "ERROR: expected exactly one .mpp artifact, found ${#artifacts[@]}" >&2
            printf '  %q\n' "${artifacts[@]}" >&2
            exit 1
          fi

          dest="output/patches-${SAFE_REPO}-pr-${PR}-${HASH}.mpp"
          mv -- "${artifacts[0]}" "$dest"
          mv -- "changelog-${SAFE_REPO}-${PR}.txt" output/

      - name: Upload Temporary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-data-${{ steps.ids.outputs.safe_repo }}-${{ matrix.target.pr }}
          path: output/*
          if-no-files-found: error
          retention-days: 1

  build-fennec:
    needs: setup
    if: needs.setup.outputs.fennec_version != ''
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'

      - name: Install fdroidserver
        run: pip install fdroidserver

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Build Dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless cmake make m4 pkg-config python-is-python3 python3-venv python3-zstandard tcl gyp ninja-build bzip2 libffi-dev libsqlite3-dev binutils-dev clang lld llvm libssl-dev libxml2-dev zlib1g-dev nodejs terser
          
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 300

      - name: Cache Gradle
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Clone fdroiddata
        run: git clone --depth 1 https://gitlab.com/fdroid/fdroiddata.git

      - name: Resolve version and prepare config
        id: resolve
        working-directory: fdroiddata
        env:
          FENNEC_VERSION: ${{ needs.setup.outputs.fennec_version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import os, sys, yaml, re
          version = os.environ["FENNEC_VERSION"]

          with open("metadata/org.mozilla.fennec_fdroid.yml") as f:
              meta = yaml.safe_load(f)

          builds = meta.get("Builds", [])
          if not builds:
              sys.exit("ERROR: no Builds entries in fennec metadata")

          vercode = None
          ver_name = None
          if version.isdigit():
              for b in builds:
                  if str(b.get("versionCode")) == version:
                      vercode, ver_name = version, b.get("versionName", "")
                      break
          else:
              for b in builds:
                  if b.get("versionName") == version:
                      vercode, ver_name = str(b.get("versionCode")), version
                      break

          if not vercode:
              lines = "\n".join(
                  f"  versionCode={b.get('versionCode')} versionName={b.get('versionName')}"
                  for b in builds[-10:]
              )
              sys.exit(f"ERROR: version '{version}' not found in metadata. Recent builds:\n{lines}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"vercode={vercode}\n")
              out.write(f"version_name={ver_name}\n")

          # Force build_tools to 37.0.0 as requested
          build_tools = "37.0.0"
          
          with open("metadata/org.mozilla.fennec_fdroid.yml", "r") as f:
              content = f.read()
          content = re.sub(r'build_tools:\s*\S+', f'build_tools: {build_tools}', content)
          with open("metadata/org.mozilla.fennec_fdroid.yml", "w") as f:
              f.write(content)

          with open("config.yml", "w") as f:
              f.write(f"sdk_path: {os.environ['ANDROID_HOME']}\n")
              f.write(f"build_tools: '{build_tools}'\n")
              f.write("serverwebroot: ''\n")

          print(f"vercode={vercode} version_name={ver_name} build_tools={build_tools}")
          PY

      - name: Install build-tools
        shell: bash
        run: |
          set -Eeuo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          # Forcing build-tools 37.0.0
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;37.0.0"

      - name: Build Fennec
        id: build
        working-directory: fdroiddata
        env:
          FENNEC_VERCODE: ${{ steps.resolve.outputs.vercode }}
          GRADLE_OPTS: "-Dorg.gradle.parallel=true -Dorg.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC"
        shell: bash
        run: |
          set -Eeuo pipefail
          fdroid build --verbose "org.mozilla.fennec_fdroid:${FENNEC_VERCODE}"
          HASH="$(git log -1 --format='%h')"
          printf 'fdroiddata_hash=%s\n' "$HASH" >> "$GITHUB_OUTPUT"

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.FENNEC_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.FENNEC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FENNEC_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.FENNEC_KEY_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail

          shopt -s nullglob
          apks=(fdroiddata/unsigned/*.apk fdroiddata/repo/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "ERROR: no APK produced by fdroid build" >&2
            exit 1
          fi

          mkdir -p signed

          if [[ -n "${KEYSTORE_B64:-}" ]]; then
            echo "Decoding provided custom keystore..."
            echo "$KEYSTORE_B64" | base64 -d > signing.keystore
            
            if [[ -z "${KEYSTORE_PASS:-}" || -z "${KEY_ALIAS:-}" || -z "${KEY_PASS:-}" ]]; then
              echo "ERROR: keystore provided but password/alias/pass secrets missing" >&2
              exit 1
            fi
          else
            echo "::warning::No FENNEC_KEYSTORE_BASE64 secret set. Generating ephemeral self-signed key."
            echo "::warning::APK will install on a fresh device but will NOT update over the official F-Droid Fennec."
            KEY_ALIAS="fennec-ephemeral"
            KEYSTORE_PASS="$(openssl rand -hex 16)"
            KEY_PASS="$KEYSTORE_PASS"
            keytool -genkeypair -v -keystore signing.keystore -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Fennec Local Build, O=Local, C=XX" 2>/dev/null
          fi

          for apk in "${apks[@]}"; do
            out="signed/$(basename "$apk")"
            apksigner sign \
              --ks signing.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASS" \
              --key-pass "pass:$KEY_PASS" \
              --out "$out" \
              "$apk"
            apksigner verify --verbose "$out" || true
          done

          rm -f signing.keystore

      - name: Create changelog marker
        env:
          VERCODE: ${{ steps.resolve.outputs.vercode }}
          VERSION_NAME: ${{ steps.resolve.outputs.version_name }}
          FDROIDDATA_HASH: ${{ steps.build.outputs.fdroiddata_hash }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p output
          {
            printf -- '- Fennec %s (versionCode `%s`) - APK uploaded as workflow artifact, not GitHub Release\n' \
              "$VERSION_NAME" "$VERCODE"
            printf '  - fdroiddata commit: [`%s`](https://gitlab.com/fdroid/fdroiddata/-/commit/%s)\n' \
              "$FDROIDDATA_HASH" "$FDROIDDATA_HASH"
          } > output/changelog-fennec.txt

      - name: Upload Fennec APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: fennec-apk-${{ steps.resolve.outputs.version_name }}
          path: signed/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload Fennec marker artifact
        uses: actions/upload-artifact@v7
        with:
          name: fennec-marker
          path: output/*.txt
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [setup, build, build-fennec]
    if: |
      always() && !cancelled()
      && !contains(needs.*.result, 'failure')
      && needs.setup.outputs.gradle_targets != '[]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download all PR data
        uses: actions/download-artifact@v8
        with:
          pattern: '*-*'
          path: downloads
          merge-multiple: true

      - name: Assemble Release Changelog
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n' 'Builds summary:' > release-changelog.txt

          shopt -s nullglob
          changelogs=(downloads/changelog-*.txt)
          if (( ${#changelogs[@]} == 0 )); then
            echo 'ERROR: no changelog artifacts found' >&2
            exit 1
          fi

          for changelog in "${changelogs[@]}"; do
            cat -- "$changelog" >> release-changelog.txt
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: pr-builds-${{ github.run_id }}
          name: 'Multi-Repo PR Builds'
          body_path: release-changelog.txt
          files: downloads/*.mpp
          fail_on_unmatched_files: false
          prerelease: true
          make_latest: false

name: Build PRs (Multi-Repo)

on:
  workflow_dispatch:
    inputs:
      pr_list:
        description: 'Targets (Format: owner/repo#PR, e.g., crimera/piko#1567, crimera/piko#1809)'
        required: true
        type: string
        default: 'crimera/piko#1567'

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.parse.outputs.targets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Parse and validate PR list
        id: parse
        env:
          PR_LIST: ${{ inputs.pr_list }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 main.py >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: ${{ fromJson(needs.setup.outputs.targets) }}
    runs-on: ubuntu-latest
    steps:
      - name: Compute safe identifiers
        id: ids
        env:
          REPO: ${{ matrix.target.repo }}
          PR: ${{ matrix.target.pr }}
        shell: bash
        run: |
          set -Eeuo pipefail

          SAFE_REPO="${REPO//\//__}"
          printf 'safe_repo=%s\n' "$SAFE_REPO" >> "$GITHUB_OUTPUT"
          printf 'repo=%s\n' "$REPO" >> "$GITHUB_OUTPUT"
          printf 'pr=%s\n' "$PR" >> "$GITHUB_OUTPUT"

      - name: Checkout PR ${{ matrix.target.pr }}
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.target.repo }}
          ref: refs/pull/${{ matrix.target.pr }}/head
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            npm ci --ignore-scripts --no-audit --no-fund
          elif [[ -f package.json ]]; then
            npm install --ignore-scripts --no-audit --no-fund
          else
            echo 'No package.json found; skipping npm dependency installation.'
          fi

      - name: Get Commit Hash & Create Changelog
        id: git-info
        env:
          REPO: ${{ matrix.target.repo }}
          PR: ${{ matrix.target.pr }}
          SAFE_REPO: ${{ steps.ids.outputs.safe_repo }}
        shell: bash
        run: |
          set -Eeuo pipefail

          COMMIT_HASH="$(git log -1 --format='%h')"
          printf 'hash=%s\n' "$COMMIT_HASH" >> "$GITHUB_OUTPUT"

          REPO_URL="https://github.com/${REPO}"
          COMMIT_URL="${REPO_URL}/commit/${COMMIT_HASH}"
          PR_URL="${REPO_URL}/pull/${PR}"

          CHANGELOG="changelog-${SAFE_REPO}-${PR}.txt"
          
          printf '%s\n' "- PR [#${PR}](${PR_URL}) (Commit: [\`${COMMIT_HASH}\`](${COMMIT_URL}), Repo: [${REPO}](${REPO_URL}))" > "$CHANGELOG"

      - name: Build with Gradle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ./gradlew :patches:buildAndroid clean --no-daemon

      - name: Prepare Assets
        env:
          SAFE_REPO: ${{ steps.ids.outputs.safe_repo }}
          PR: ${{ matrix.target.pr }}
          HASH: ${{ steps.git-info.outputs.hash }}
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p output

          shopt -s nullglob
          artifacts=(patches/build/libs/patches-*.mpp)

          if (( ${#artifacts[@]} != 1 )); then
            echo "ERROR: expected exactly one .mpp artifact, found ${#artifacts[@]}" >&2
            printf '  %q\n' "${artifacts[@]}" >&2
            exit 1
          fi

          dest="output/patches-${SAFE_REPO}-pr-${PR}-${HASH}.mpp"
          mv -- "${artifacts[0]}" "$dest"

          mv -- "changelog-${SAFE_REPO}-${PR}.txt" output/

      - name: Upload Temporary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-data-${{ steps.ids.outputs.safe_repo }}-${{ matrix.target.pr }}
          path: output/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [setup, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download all PR data
        uses: actions/download-artifact@v8
        with:
          pattern: pr-data-*
          path: downloads
          merge-multiple: true

      - name: Assemble Release Changelog
        shell: bash
        run: |
          set -Eeuo pipefail

          printf '%s\n' 'Builds summary:' > release-changelog.txt

          shopt -s nullglob
          changelogs=(downloads/changelog-*.txt)

          if (( ${#changelogs[@]} == 0 )); then
            echo 'ERROR: no changelog artifacts found' >&2
            exit 1
          fi

          for changelog in "${changelogs[@]}"; do
            cat -- "$changelog" >> release-changelog.txt
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: pr-builds-${{ github.run_id }}
          name: 'Multi-Repo PR Builds'
          body_path: release-changelog.txt
          files: downloads/*.mpp
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false
